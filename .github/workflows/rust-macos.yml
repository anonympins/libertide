name: Build & Package macOS Executable

on:
  push:
    branches: [ "main" ]
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: "target"

jobs:
  build-macos:
    name: Build & Package (macOS Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set Environment for Metal acceleration
        run: |
          echo "LLAMA_METAL=1" >> $GITHUB_ENV
          echo "CMAKE_ARGS=-DGGML_METAL=ON" >> $GITHUB_ENV

      - name: Fix Apple Clang march flag for Apple Silicon
        run: |
          mkdir -p "$HOME/bin"
          cat << 'EOF' > "$HOME/bin/clang-wrapper"
          #!/bin/bash
          args=()
          for arg in "$@"; do
            if [ "$arg" = "-march=apple-m1" ]; then
              args+=("-mcpu=apple-m1")
            else
              args+=("$arg")
            fi
          done
          exec /usr/bin/clang "${args[@]}"
          EOF
          chmod +x "$HOME/bin/clang-wrapper"

          sed 's|/usr/bin/clang|/usr/bin/clang++|g' "$HOME/bin/clang-wrapper" > "$HOME/bin/clang++-wrapper"
          chmod +x "$HOME/bin/clang++-wrapper"

          echo "CC=$HOME/bin/clang-wrapper" >> $GITHUB_ENV
          echo "CXX=$HOME/bin/clang++-wrapper" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER=$HOME/bin/clang-wrapper" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER=$HOME/bin/clang++-wrapper" >> $GITHUB_ENV

      - name: Rust Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests (release)
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Prepare distribution package
        run: |
          mkdir -p dist
          cp target/release/libertide dist/libertide
          [ -f README.md ] && cp README.md dist/
          [ -f LICENSE ] && cp LICENSE dist/
          tar -czvf libertide-macos-arm64.tar.gz -C dist .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libertide-macos-arm64
          path: libertide-macos-arm64.tar.gz
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: libertide-macos-arm64.tar.gz
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}