name: Build & Package Windows Executables

on:
  push:
    branches: [ "main" ]
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build & Package (Windows x64 & x86)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable with x64 & x86 targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

      - name: Install Vulkan SDK via Chocolatey
        shell: powershell
        run: |
          choco install vulkan-sdk -y --no-progress
          $vulkanPath = (Get-ChildItem -Path "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          Write-Host "Vulkan SDK found at: $vulkanPath"
          Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_SDK=$vulkanPath"
          Add-Content -Path $env:GITHUB_PATH -Value "$vulkanPath\Bin"

      - name: Rust Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --verbose --features vulkan

      - name: Build optimized release executables (64-bit and 32-bit)
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --verbose --features vulkan
          cargo build --release --target i686-pc-windows-msvc --verbose

      - name: Prepare distribution executables
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $exe64 = Get-ChildItem -Path target/x86_64-pc-windows-msvc/release -Filter "*.exe" | Where-Object { $_.Name -notlike "*test*" } | Select-Object -First 1
          $exe32 = Get-ChildItem -Path target/i686-pc-windows-msvc/release -Filter "*.exe" | Where-Object { $_.Name -notlike "*test*" } | Select-Object -First 1
          if (-not $exe64) { throw "Aucun binaire .exe trouvé dans target/x86_64-pc-windows-msvc/release" }
          if (-not $exe32) { throw "Aucun binaire .exe trouvé dans target/i686-pc-windows-msvc/release" }
          Copy-Item $exe64.FullName -Destination "dist/libertide-x64.exe"
          Copy-Item $exe32.FullName -Destination "dist/libertide-x86.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libertide-windows-executables
          path: dist/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
