name: Build & Package Windows Executable

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
      - "libertide-*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build & Package (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --verbose

      - name: Build optimized release executable
        run: cargo build --release --verbose

      - name: Prepare distribution package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/release/libertide.exe -Destination dist/
          if (Test-Path README.md) { Copy-Item README.md -Destination dist/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE -Destination dist/ }
          Compress-Archive -Path dist/* -DestinationPath libertide-windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libertide-windows-x64
          path: |
            libertide-windows-x64.zip
            target/release/libertide.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            libertide-windows-x64.zip
            target/release/libertide.exe
