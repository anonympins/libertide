name: Build & Package Windows Executable

on:
  push:
    branches: [ "main" ]
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: "C:\\t"
  CMAKE_GENERATOR: "Ninja"
  CMAKE_POLICY_VERSION_MINIMUM: "3.30"
  CMAKE_TOOLCHAIN_FILE: "${{ github.workspace }}\\cmake\\windows-toolchain.cmake"

jobs:
  build-windows:
    name: Build & Package (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer tools & Ninja
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Vulkan SDK via Chocolatey
        shell: pwsh
        run: |
          choco install vulkan-sdk ninja -y --no-progress
          $sdkPath = (Get-ChildItem -Directory "C:\VulkanSDK" | Sort-Object Name -Descending | Select-Object -First 1).FullName
          Write-Host "Vulkan SDK installé sous: $sdkPath"
          "VULKAN_SDK=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VK_SDK_PATH=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdkPath\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          if (Test-Path "$sdkPath\Lib") {
            "$sdkPath\Lib" | Out-File -FilePath $env:GITHUB_PATH -Append
            "LIB=$env:LIB;$sdkPath\Lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~\AppData\Local\sherpa-rs\
            C:/t/
          key: ${{ runner.os }}-x86_64-pc-windows-msvc-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-pc-windows-msvc-cargo-
            ${{ runner.os }}-cargo-

      - name: Configure library search paths for Sherpa & ONNX Runtime
        shell: pwsh
        run: |
          $sherpaLib = Get-ChildItem -Path "$env:LOCALAPPDATA\sherpa-rs" -Recurse -Directory -Filter "lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sherpaLib -or -not (Test-Path "$($sherpaLib.FullName)\cargs.lib")) {
            Write-Host "Sherpa libraries missing from runner. Rebuilding sherpa-rs-sys..."
            cargo clean -p sherpa-rs-sys -p sherpa-rs --target x86_64-pc-windows-msvc
            cargo build --release -p sherpa-rs-sys --target x86_64-pc-windows-msvc
            $sherpaLib = Get-ChildItem -Path "$env:LOCALAPPDATA\sherpa-rs" -Recurse -Directory -Filter "lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($sherpaLib) {
            Write-Host "Sherpa libraries found in: $($sherpaLib.FullName)"
            "LIB=$env:LIB;$($sherpaLib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
            "$($sherpaLib.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Append
          } else {
            Write-Error "Unable to locate sherpa-rs native library directory!"
            exit 1
          }

      - name: Run tests (release profile)
        run: cargo test --release --target x86_64-pc-windows-msvc --features vulkan

      - name: Build optimized release executable
        run: cargo build --release --target x86_64-pc-windows-msvc --features vulkan

      - name: Prepare distribution package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "C:/t/x86_64-pc-windows-msvc/release/libertide.exe" dist/
          $sherpaLib = Get-ChildItem -Path "$env:LOCALAPPDATA\sherpa-rs" -Recurse -Directory -Filter "lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sherpaLib) {
            Copy-Item "$($sherpaLib.FullName)\*.dll" dist/ -ErrorAction SilentlyContinue
          }
          if (Test-Path README.md) { Copy-Item README.md dist/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE dist/ }
          Compress-Archive -Path dist/* -DestinationPath "libertide-windows-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libertide-windows-x64
          path: libertide-windows-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: libertide-windows-x64.zip
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}