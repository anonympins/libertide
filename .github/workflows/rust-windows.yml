name: Build & Package Windows Executable

on:
  push:
    branches: [ "main" ]
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: "C:\\t"
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0"
  CMAKE_GENERATOR: "Ninja"
  CMAKE_POLICY_VERSION_MINIMUM: "3.30"
  CMAKE_TOOLCHAIN_FILE: "${{ github.workspace }}\\cmake\\windows-toolchain.cmake"
  CC: "cl"
  CXX: "cl"

jobs:
  build-windows:
    name: Build & Package (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer tools & Ninja
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Install & Cache Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true
          stripdown: true
          install_runtime: true

      - name: Configure Vulkan SDK environment
        shell: pwsh
        run: |
          $sdkPath = if ($env:VULKAN_SDK) { $env:VULKAN_SDK } else { (Get-ChildItem -Directory "C:\VulkanSDK" | Sort-Object Name -Descending | Select-Object -First 1).FullName }
          Write-Host "Vulkan SDK configuré sous: $sdkPath"
          Add-Content -Path $env:GITHUB_ENV -Value "VK_SDK_PATH=$sdkPath" -Encoding utf8
          Add-Content -Path $env:GITHUB_PATH -Value "$sdkPath\Bin" -Encoding utf8
          if (Test-Path "$sdkPath\Lib") {
            Add-Content -Path $env:GITHUB_PATH -Value "$sdkPath\Lib" -Encoding utf8
            $currentLib = if ($env:LIB) { "$env:LIB;$sdkPath\Lib" } else { "$sdkPath\Lib" }
            Add-Content -Path $env:GITHUB_ENV -Value "LIB=$currentLib" -Encoding utf8
          }
          Add-Content -Path $env:GITHUB_PATH -Value "C:\ProgramData\chocolatey\bin" -Encoding utf8

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~\AppData\Local\sherpa-rs\
            C:/t/
          key: ${{ runner.os }}-x86_64-pc-windows-msvc-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-pc-windows-msvc-cargo-
            ${{ runner.os }}-cargo-

      - name: Configure library search paths for Sherpa & ONNX Runtime
        shell: pwsh
        run: |
          # Pré-créer les répertoires deps pour éviter que build.rs de sherpa-rs-sys ne panique lors du std::fs::copy
          New-Item -ItemType Directory -Force -Path @(
            "C:\t\x86_64-pc-windows-msvc\release\deps",
            "C:\t\x86_64-pc-windows-msvc\debug\deps",
            "C:\t\release\deps",
            "C:\t\debug\deps"
          ) | Out-Null

          $sherpaLib = Get-ChildItem -Path "$env:LOCALAPPDATA\sherpa-rs" -Recurse -Directory -Filter "lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sherpaLib -or -not (Test-Path "$($sherpaLib.FullName)\cargs.lib")) {
            Write-Host "Sherpa libraries missing from runner. Rebuilding sherpa-rs-sys..."
            cargo clean -p sherpa-rs-sys -p sherpa-rs --target x86_64-pc-windows-msvc
            cargo build --release -p sherpa-rs-sys --target x86_64-pc-windows-msvc
            $sherpaLib = Get-ChildItem -Path "$env:LOCALAPPDATA\sherpa-rs" -Recurse -Directory -Filter "lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          # Nettoyer les artefacts CMake de llama-cpp-sys-2 pouvant contenir des chemins obsolètes vers cl.exe
          cargo clean -p llama-cpp-sys-2 --target x86_64-pc-windows-msvc 2>$null

          if ($sherpaLib) {
            Write-Host "Sherpa libraries found in: $($sherpaLib.FullName)"
            $currentLib = if ($env:LIB) { "$env:LIB;$($sherpaLib.FullName)" } else { "$($sherpaLib.FullName)" }
            Add-Content -Path $env:GITHUB_ENV -Value "LIB=$currentLib" -Encoding utf8
            Add-Content -Path $env:GITHUB_PATH -Value "$($sherpaLib.FullName)" -Encoding utf8
          } else {
            Write-Error "Unable to locate sherpa-rs native library directory!"
            exit 1
          }

      - name: Run tests (release profile)
        run: cargo test --release --target x86_64-pc-windows-msvc --features vulkan

      - name: Build optimized release executable
        run: cargo build --release --target x86_64-pc-windows-msvc --features vulkan

      - name: Prepare distribution package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "C:/t/x86_64-pc-windows-msvc/release/libertide.exe" dist/
          $sherpaLib = Get-ChildItem -Path "$env:LOCALAPPDATA\sherpa-rs" -Recurse -Directory -Filter "lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sherpaLib) {
            Copy-Item "$($sherpaLib.FullName)\*.dll" dist/ -ErrorAction SilentlyContinue
          }
          if (Test-Path README.md) { Copy-Item README.md dist/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE dist/ }
          # Exclusion stricte des modèles neuronaux volumineux
          if (Test-Path dist/models) { Remove-Item -Recurse -Force dist/models }
          Get-ChildItem -Path dist -Include "*.onnx","*.bin","*.gguf","*.tflite","*.tar.bz2","*.tmp" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
          Compress-Archive -Path dist/* -DestinationPath "libertide-windows-x64.zip"

      - name: Prune target directory before caching
        shell: pwsh
        run: |
          Write-Host "Nettoyage des fichiers temporaires et symboles lourds (.pdb, .obj)..."
          Get-ChildItem -Path "C:\t" -Include "*.pdb", "*.obj" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem -Path "C:\t" -Directory -Filter "incremental" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          Write-Host "Nettoyage terminé."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libertide-windows-x64
          path: libertide-windows-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: libertide-windows-x64.zip
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}