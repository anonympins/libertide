name: Build & Package Linux Executable

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
      - "libertide-*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build & Package (Linux x64)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build tools & libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libasound2-dev \
            libxkbcommon-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libwayland-dev \
            libx11-dev \
            xdotool \
            wmctrl \
            xclip \
            speech-dispatcher \
            espeak-ng

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --verbose

      - name: Build optimized release executable
        run: cargo build --release --verbose

      - name: Prepare distribution package
        run: |
          mkdir -p dist
          cp target/release/libertide dist/
          [ -f README.md ] && cp README.md dist/
          [ -f LICENSE ] && cp LICENSE dist/
          tar -czvf libertide-linux-x64.tar.gz -C dist .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libertide-linux-x64
          path: |
            libertide-linux-x64.tar.gz
            target/release/libertide
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            libertide-linux-x64.tar.gz
            target/release/libertide