name: Build & Package Linux Executable

on:
  push:
    branches: [ "main" ]
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: "target"
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  build-linux:
    name: Build & Package (Linux x64)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build tools & libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            mold \
            libasound2-dev \
            libxkbcommon-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libwayland-dev \
            libx11-dev \
            xdotool \
            wmctrl \
            xclip \
            wl-clipboard \
            speech-dispatcher \
            espeak-ng

      - name: Install Vulkan SDK via LunarG APT repository
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-$(lsb_release -cs).list http://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          echo "VULKAN_SDK=/usr" >> $GITHUB_ENV
          echo "VULKAN_SDK found at /usr"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests (release profile)
        run: cargo test --release --features vulkan

      - name: Build optimized release executable
        run: cargo build --release --features vulkan

      - name: Prepare distribution package
        run: |
          mkdir -p dist
          BIN=$(find target/release -maxdepth 1 -type f -executable ! -name "*.so" ! -name "*.d" | head -n 1)
          cp "$BIN" dist/libertide
          [ -f README.md ] && cp README.md dist/
          [ -f LICENSE ] && cp LICENSE dist/
          tar -czvf libertide-linux-x64.tar.gz -C dist .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libertide-linux-x64
          path: libertide-linux-x64.tar.gz
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: libertide-linux-x64.tar.gz
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}