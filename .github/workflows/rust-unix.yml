name: Build & Package Linux Executable

on:
  push:
    branches: [ "main" ]
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: "target"
  CMAKE_POLICY_VERSION_MINIMUM: "3.30"

jobs:
  build-linux:
    name: Build & Package (Linux x64)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build tools & libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libasound2-dev \
            libxkbcommon-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libwayland-dev \
            libxtst-dev \
            libx11-dev \
            xdotool \
            wmctrl \
            xclip \
            wl-clipboard \
            speech-dispatcher \
            espeak-ng

      - name: Install Vulkan development packages
        run: |
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            glslc \
            vulkan-tools \
            glslang-tools \
            glslang-dev \
            spirv-tools \
            spirv-headers
          echo "VULKAN_SDK=/usr" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=/usr:${CMAKE_PREFIX_PATH:-}" >> $GITHUB_ENV
          echo "VULKAN_SDK found at /usr"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cache/sherpa-rs/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Configure library search paths for Sherpa & ONNX Runtime
        run: |
          # If the cache restored target/ without ~/.cache/sherpa-rs, force sherpa-rs-sys to re-run build.rs
          SHERPA_LIB_DIR=$(find "$HOME/.cache/sherpa-rs" -type d -name "lib" 2>/dev/null | head -n 1)
          if [ -z "$SHERPA_LIB_DIR" ] || [ ! -f "$SHERPA_LIB_DIR/libsherpa-onnx-c-api.so" ]; then
            echo "Sherpa libraries missing from runner. Rebuilding sherpa-rs-sys..."
            cargo clean -p sherpa-rs-sys -p sherpa-rs
            cargo build --release -p sherpa-rs-sys
            SHERPA_LIB_DIR=$(find "$HOME/.cache/sherpa-rs" -type d -name "lib" 2>/dev/null | head -n 1)
          fi

          if [ -z "$SHERPA_LIB_DIR" ]; then
            echo "::error::Unable to locate sherpa-rs native library directory!"
            exit 1
          fi

          echo "Sherpa libraries found in: $SHERPA_LIB_DIR"

          # Ensure unversioned soname symlink exists for onnxruntime
          if [ ! -f "$SHERPA_LIB_DIR/libonnxruntime.so" ]; then
            ORT_TARGET=$(find "$SHERPA_LIB_DIR" -maxdepth 1 -name "libonnxruntime.so*" | head -n 1)
            if [ -n "$ORT_TARGET" ]; then
              ln -sf "$(basename "$ORT_TARGET")" "$SHERPA_LIB_DIR/libonnxruntime.so"
            fi
          fi

          # Clean any stale/corrupted build artifacts for llama-cpp-sys-2 from previous cached runs
          cargo clean -p llama-cpp-sys-2 || true

          echo "LIBRARY_PATH=$SHERPA_LIB_DIR:${LIBRARY_PATH:-}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$SHERPA_LIB_DIR:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      - name: Run tests (release profile)
        run: cargo test --release --features vulkan

      - name: Build optimized release executable
        run: cargo build --release --features vulkan

      - name: Prepare distribution package
        run: |
          mkdir -p dist
          BIN=$(find target/release -maxdepth 1 -type f -executable ! -name "*.so" ! -name "*.d" | head -n 1)
          cp "$BIN" dist/libertide
          SHERPA_LIB_DIR=$(find "$HOME/.cache/sherpa-rs" -type d -name "lib" 2>/dev/null | head -n 1)
          if [ -n "$SHERPA_LIB_DIR" ]; then
            cp -d "$SHERPA_LIB_DIR"/*.so* dist/ 2>/dev/null || true
          fi
          [ -f README.md ] && cp README.md dist/
          [ -f LICENSE ] && cp LICENSE dist/
          # Exclusion stricte des modèles neuronaux volumineux
          rm -rf dist/models dist/*.onnx dist/*.bin dist/*.gguf dist/*.tflite dist/*.tar.bz2 dist/*.tmp 2>/dev/null || true
          tar -czvf libertide-linux-x64.tar.gz -C dist .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libertide-linux-x64
          path: libertide-linux-x64.tar.gz
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: libertide-linux-x64.tar.gz
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}