name: Build & Package Linux Executable

on:
  push:
    branches: [ "main" ]
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: "target"
  CMAKE_POLICY_VERSION_MINIMUM: "3.30"

jobs:
  build-linux:
    name: Build & Package (Linux x64)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build tools & libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libasound2-dev \
            libxkbcommon-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libwayland-dev \
            libxtst-dev \
            libx11-dev \
            xdotool \
            wmctrl \
            xclip \
            wl-clipboard \
            speech-dispatcher \
            espeak-ng

      - name: Install Vulkan development packages
        run: |
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            glslc \
            vulkan-tools \
            glslang-tools \
            glslang-dev \
            spirv-tools \
            spirv-headers
          echo "VULKAN_SDK=/usr" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=/usr:${CMAKE_PREFIX_PATH:-}" >> $GITHUB_ENV
          echo "VULKAN_SDK found at /usr"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cache/sherpa-rs/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Configure library search paths for Sherpa & ONNX Runtime
        run: |
          # 1. Créer impérativement les dossiers de destination pour que Cargo et std::fs::copy ne paniquent pas
          mkdir -p target/release/deps target/debug/deps

          # 2. Déclencher le téléchargement des bibliothèques sherpa-onnx si absentes du cache
          if [ ! -d "$HOME/.cache/sherpa-rs" ] || [ -z "$(find "$HOME/.cache/sherpa-rs" -name "libsherpa-onnx-c-api.so" 2>/dev/null)" ]; then
            echo "Sherpa libraries missing from runner. Downloading via cargo check..."
            cargo check --release --package sherpa-rs-sys || true
          fi

          # 3. Créer une copie réelle de libonnxruntime.so dans TOUS les répertoires lib sous le cache
          find "$HOME/.cache/sherpa-rs" -type f -name "libonnxruntime.so.*" 2>/dev/null | while read -r ort; do
            dir=$(dirname "$ort")
            rm -f "$dir/libonnxruntime.so"
            cp -f "$ort" "$dir/libonnxruntime.so"
          done

          SHERPA_LIB_DIR=$(find "$HOME/.cache/sherpa-rs" -type d -name "lib" 2>/dev/null | head -n 1)
          if [ -z "$SHERPA_LIB_DIR" ]; then
            echo "::error::Unable to locate sherpa-rs native library directory!"
            exit 1
          fi
          echo "Sherpa libraries found in: $SHERPA_LIB_DIR"

          # 4. Installer les bibliothèques partagées dans /usr/local/lib et rafraîchir ldconfig
          find "$HOME/.cache/sherpa-rs" -name "*.so*" -type f -exec sudo cp -f {} /usr/local/lib/ \; 2>/dev/null || true
          find "$HOME/.cache/sherpa-rs" -name "libonnxruntime.so" -exec sudo cp -f {} /usr/local/lib/ \; 2>/dev/null || true
          sudo ldconfig

          # 5. S'assurer que les bibliothèques sont présentes dans target/release/deps
          cp -d "$SHERPA_LIB_DIR"/*.so* target/release/deps/ 2>/dev/null || true
          cp -d "$SHERPA_LIB_DIR"/*.so* target/debug/deps/ 2>/dev/null || true

          # Clean any stale/corrupted build artifacts for llama-cpp-sys-2 from previous cached runs
          cargo clean -p llama-cpp-sys-2 || true

          echo "LIBRARY_PATH=/usr/local/lib:$SHERPA_LIB_DIR:${LIBRARY_PATH:-}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/lib:$SHERPA_LIB_DIR:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      - name: Run tests (release profile)
        run: cargo test --release --features vulkan

      - name: Build optimized release executable
        run: cargo build --release --features vulkan

      - name: Prepare distribution package
        run: |
          mkdir -p dist
          BIN=$(find target/release -maxdepth 1 -type f -executable ! -name "*.so" ! -name "*.d" | head -n 1)
          cp "$BIN" dist/libertide
          SHERPA_LIB_DIR=$(find "$HOME/.cache/sherpa-rs" -type d -name "lib" 2>/dev/null | head -n 1)
          if [ -n "$SHERPA_LIB_DIR" ]; then
            cp -d "$SHERPA_LIB_DIR"/*.so* dist/ 2>/dev/null || true
          fi
          [ -f README.md ] && cp README.md dist/
          [ -f LICENSE ] && cp LICENSE dist/
          # Exclusion stricte des modèles neuronaux volumineux
          rm -rf dist/models dist/*.onnx dist/*.bin dist/*.gguf dist/*.tflite dist/*.tar.bz2 dist/*.tmp 2>/dev/null || true
          tar -czvf libertide-linux-x64.tar.gz -C dist .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libertide-linux-x64
          path: libertide-linux-x64.tar.gz
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: libertide-linux-x64.tar.gz
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}