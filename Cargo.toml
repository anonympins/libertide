[package]
name = "libertide"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu","glow"] }
egui = "0.36.2"
whisper-rs = { version = "0.16.0"}
hound = "3.5"
cpal = "0.18.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Media_Speech",
    "Win32_Media_Audio",
    "Win32_UI_Accessibility",
] }