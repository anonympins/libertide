[package]
name = "libertide"
version = "0.6.7"
edition = "2021"

[features]
default = []
vulkan = ["llama-cpp-2/vulkan"]

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "glow", "x11", "wayland"] }
egui = "0.37.0"
whisper-rs = { version = "0.16.0"}
cpal = "0.18.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
rust-i18n = "4.2.4"
llama-cpp-2 = { version = "0.1" }

[target.'cfg(target_os = "linux")'.dependencies]
ocrs = "0.13.1"
rten = "0.26.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Media_Speech",
    "Win32_Media_Audio",
    "Win32_UI_Accessibility",
] }

# Optimise au maximum le calcul matriciel et tenseurs en mode dev :
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true